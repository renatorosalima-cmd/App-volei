<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Vôlei Completo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #facc15;
      --text: #f8fafc;
      --danger: #ef4444;
      --success: #22c55e;
      --action: #3b82f6;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }

    .tab-content {
      display: none;
      padding: 1rem;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      padding: 1.2rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    input, select {
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .search-inputs {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .search-inputs input {
      flex: 3;
    }

    .search-inputs select {
      flex: 1;
    }

    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin: 4px;
      font-size: 0.95rem;
    }

    .btn-main {
      background: var(--accent);
      color: #000;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
    }

    .btn-add {
      background: var(--success);
      color: white;
      padding: 10px 18px;
    }

    .btn-sub {
      background: #64748b;
      color: white;
      padding: 10px 14px;
    }

    .btn-action {
      background: var(--action);
      color: white;
      padding: 10px;
      margin-top: 8px;
    }

    .team-select-container {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .team-select-box {
      flex: 1;
    }

    .score-control {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    .grid-weather {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .weather-item {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
    }

    .volley-alert {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      line-height: 1.4;
    }

    /* ESTILO DA ILUSTRAÇÃO DA QUADRA SVG */
    .court-illustration-container {
      margin-top: 15px;
      border-radius: 12px;
      overflow: hidden;
      background: #0f172a;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .court-svg {
      width: 100%;
      height: 180px;
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #334155;
      text-align: center;
    }

    th {
      color: var(--accent);
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #000;
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 2px solid var(--accent);
      z-index: 1000;
    }

    nav button {
      background: none;
      color: white;
      font-size: 1.4rem;
      margin: 0;
      padding: 4px 12px;
    }
  </style>
</head>
<body>

  <!-- ABA: PLACAR -->
  <div id="tab-placar" class="tab-content active">
    <div class="card">
      <h3>🏐 Seleção do Confronto</h3>
      <div class="team-select-container">
        <div class="team-select-box">
          <label><small>Time A (Esquerda)</small></label>
          <select id="selectTeamA" style="width: 100%;" onchange="updateMatchTeams()"></select>
        </div>
        <div class="team-select-box">
          <label><small>Time B (Direita)</small></label>
          <select id="selectTeamB" style="width: 100%;" onchange="updateMatchTeams()"></select>
        </div>
      </div>
    </div>

    <!-- Cronômetro -->
    <div class="card">
      <div id="timer" style="font-size: 2.5rem; font-weight: bold; margin-bottom: 8px;">00:00</div>
      <button onclick="startTimer()">▶ Iniciar</button>
      <button onclick="pauseTimer()">⏸ Pausar</button>
      <button onclick="resetTimer()">⏹ Zerar Tempo</button>
    </div>

    <!-- Placar Principal -->
    <div class="card">
      <h3>
        <span id="labelTeamA">Time A</span> 
        <small style="color: var(--accent);">(Sets: <span id="sets1">0</span>)</small>: 
        <span id="s1" style="font-size: 2.2rem; color: var(--accent);">0</span>
      </h3>
      <div class="score-control">
        <button class="btn-sub" onclick="removePoint(1)">-1</button>
        <button class="btn-add" onclick="addPoint(1)">+1 Ponto (A)</button>
      </div>

      <hr style="border-color: #334155; margin: 15px 0;">

      <h3>
        <span id="labelTeamB">Time B</span> 
        <small style="color: var(--accent);">(Sets: <span id="sets2">0</span>)</small>: 
        <span id="s2" style="font-size: 2.2rem; color: var(--accent);">0</span>
      </h3>
      <div class="score-control">
        <button class="btn-sub" onclick="removePoint(2)">-1</button>
        <button class="btn-add" onclick="addPoint(2)">+1 Ponto (B)</button>
      </div>

      <hr style="border-color: #334155; margin: 15px 0;">

      <button class="btn-action" onclick="finishSet()">🏁 Finalizar Set</button>
      <button class="btn-action" style="background: #8b5cf6;" onclick="finishMatch()">🏆 Finalizar Partida</button>
      <br>
      <button onclick="resetMatch()" style="background: var(--danger); color: white; margin-top: 10px;">Reiniciar Partida</button>
    </div>
  </div>

  <!-- ABA: DUPLAS -->
  <div id="tab-times" class="tab-content">
    <div class="card">
      <h3>➕ Cadastrar / Editar Dupla</h3>
      <input type="hidden" id="edit-id">
      <input type="text" id="timeName" style="width: 90%;" placeholder="Nome da Dupla">
      <input type="text" id="p1Name" style="width: 90%;" placeholder="Jogador 1">
      <input type="text" id="p2Name" style="width: 90%;" placeholder="Jogador 2">
      <button class="btn-main" onclick="saveTeam()">Salvar Dupla</button>
    </div>
    <div class="card">
      <h3>📋 Duplas Cadastradas</h3>
      <div id="teamsList"></div>
    </div>
  </div>

  <!-- ABA: RANKING -->
  <div id="tab-ranking" class="tab-content">
    <div class="card">
      <h3>🏆 Ranking Geral</h3>
      <table id="rankingTable"></table>
      <button onclick="resetRanking()" style="background: var(--danger); color: white; margin-top: 20px; width: 100%; padding: 12px;">🔄 Zerar Vitórias do Ranking</button>
    </div>
  </div>

  <!-- ABA: DICAS -->
  <div id="tab-dicas" class="tab-content">
    <div class="card">
      <h3>💡 Dicas & Táticas</h3>
      <p>Use esta área para anotar estratégias do seu time ou rever vídeos dos treinos.</p>
    </div>
  </div>

  <!-- ABA: PREVISÃO DO TEMPO -->
  <div id="tab-tempo" class="tab-content">
    <div class="card">
      <h3>☀️ Previsão do Tempo</h3>
      
      <div class="search-inputs">
        <input type="text" id="cityName" placeholder="Cidade (ex: Ibaiti ou Joaquim Távora)">
        <select id="stateSelect">
          <option value="">UF</option>
          <option value="PR" selected>PR</option>
          <option value="SP">SP</option>
          <option value="SC">SC</option>
          <option value="RS">RS</option>
          <option value="MG">MG</option>
          <option value="RJ">RJ</option>
          <option value="AC">AC</option>
          <option value="AL">AL</option>
          <option value="AP">AP</option>
          <option value="AM">AM</option>
          <option value="BA">BA</option>
          <option value="CE">CE</option>
          <option value="DF">DF</option>
          <option value="ES">ES</option>
          <option value="GO">GO</option>
          <option value="MA">MA</option>
          <option value="MT">MT</option>
          <option value="MS">MS</option>
          <option value="PA">PA</option>
          <option value="PB">PB</option>
          <option value="PE">PE</option>
          <option value="PI">PI</option>
          <option value="RN">RN</option>
          <option value="RO">RO</option>
          <option value="RR">RR</option>
          <option value="SE">SE</option>
          <option value="TO">TO</option>
        </select>
      </div>

      <button onclick="getWeather()" class="btn-main" style="margin-top: 8px;">Buscar Previsão</button>
      <button onclick="getWeatherByGPS()" style="background: #475569; color: white; width: 100%; margin-top: 5px;">📍 Usar Minha Localização Atual</button>

      <div id="weather-display" style="margin-top: 20px;"></div>
    </div>
  </div>

  <!-- NAVEGAÇÃO INFERIOR -->
  <nav>
    <button onclick="show('tab-placar')">🏐</button>
    <button onclick="show('tab-times')">👥</button>
    <button onclick="show('tab-ranking')">🏆</button>
    <button onclick="show('tab-dicas')">💡</button>
    <button onclick="show('tab-tempo')">☀️</button>
  </nav>

  <!-- LÓGICA DO APLICATIVO -->
  <script>
    let teams = JSON.parse(localStorage.getItem('teams')) || [];
    let s1 = 0, s2 = 0;
    let sets1 = 0, sets2 = 0;
    let timerInterval = null, secs = 0;

    function show(id) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      if (id === 'tab-ranking') renderRanking();
      if (id === 'tab-placar') populateTeamSelectors();
    }

    function populateTeamSelectors() {
      const selectA = document.getElementById('selectTeamA');
      const selectB = document.getElementById('selectTeamB');

      const currentA = selectA.value;
      const currentB = selectB.value;

      selectA.innerHTML = '<option value="">Selecione Time A</option>';
      selectB.innerHTML = '<option value="">Selecione Time B</option>';

      teams.forEach(t => {
        selectA.innerHTML += `<option value="${t.name}">${t.name}</option>`;
        selectB.innerHTML += `<option value="${t.name}">${t.name}</option>`;
      });

      selectA.value = currentA;
      selectB.value = currentB;
      updateMatchTeams();
    }

    function updateMatchTeams() {
      const nameA = document.getElementById('selectTeamA').value;
      const nameB = document.getElementById('selectTeamB').value;

      document.getElementById('labelTeamA').innerText = nameA || "Time A";
      document.getElementById('labelTeamB').innerText = nameB || "Time B";
    }

    function addPoint(team) {
      if (team === 1) s1++; else s2++;
      updateScoreboard();
    }

    function removePoint(team) {
      if (team === 1 && s1 > 0) s1--;
      if (team === 2 && s2 > 0) s2--;
      updateScoreboard();
    }

    function updateScoreboard() {
      document.getElementById('s1').innerText = s1;
      document.getElementById('s2').innerText = s2;
      document.getElementById('sets1').innerText = sets1;
      document.getElementById('sets2').innerText = sets2;
    }

    function finishSet() {
      if (s1 === s2) return alert("O set está empatado! Marque o ponto de desempate.");

      if (s1 > s2) {
        sets1++;
        alert(`Set Finalizado!\nVencedor: ${document.getElementById('labelTeamA').innerText}`);
      } else {
        sets2++;
        alert(`Set Finalizado!\nVencedor: ${document.getElementById('labelTeamB').innerText}`);
      }

      s1 = 0; s2 = 0;
      updateScoreboard();
    }

    function finishMatch() {
      const nameA = document.getElementById('selectTeamA').value;
      const nameB = document.getElementById('selectTeamB').value;

      if (!nameA || !nameB) return alert("Selecione ambas as duplas antes de finalizar a partida!");

      let winnerName = "";
      if (sets1 > sets2) {
        winnerName = nameA;
      } else if (sets2 > sets1) {
        winnerName = nameB;
      } else {
        if (s1 > s2) winnerName = nameA;
        else if (s2 > s1) winnerName = nameB;
        else return alert("A partida está empatada!");
      }

      let winnerObj = teams.find(t => t.name === winnerName);
      if (winnerObj) {
        winnerObj.wins++;
        localStorage.setItem('teams', JSON.stringify(teams));
      }

      alert(`🎉 Partida Finalizada!\n\nVencedor: ${winnerName}\n1 Vitória somada no Ranking com sucesso!`);
      resetMatch();
    }

    function startTimer() {
      if (!timerInterval) {
        timerInterval = setInterval(() => {
          secs++;
          document.getElementById('timer').innerText = new Date(secs * 1000).toISOString().substr(14, 5);
        }, 1000);
      }
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function resetTimer() {
      pauseTimer();
      secs = 0;
      document.getElementById('timer').innerText = "00:00";
    }

    function resetMatch() {
      s1 = 0; s2 = 0; sets1 = 0; sets2 = 0;
      updateScoreboard();
      resetTimer();
    }

    function saveTeam() {
      let name = document.getElementById('timeName').value;
      let p1 = document.getElementById('p1Name').value;
      let p2 = document.getElementById('p2Name').value;
      let editId = document.getElementById('edit-id').value;

      if (!name) return alert("Digite o nome da dupla!");

      if (editId) {
        let t = teams.find(item => item.id == editId);
        if (t) { t.name = name; t.p1 = p1; t.p2 = p2; }
      } else {
        teams.push({ id: Date.now(), name, p1, p2, wins: 0 });
      }

      localStorage.setItem('teams', JSON.stringify(teams));
      resetForm();
      renderTeams();
      populateTeamSelectors();
    }

    function resetForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('timeName').value = '';
      document.getElementById('p1Name').value = '';
      document.getElementById('p2Name').value = '';
    }

    function editTeam(id) {
      let t = teams.find(item => item.id == id);
      if (t) {
        document.getElementById('edit-id').value = t.id;
        document.getElementById('timeName').value = t.name;
        document.getElementById('p1Name').value = t.p1 || '';
        document.getElementById('p2Name').value = t.p2 || '';
        show('tab-times');
      }
    }

    function deleteTeam(id) {
      if (confirm("Deseja apagar esta dupla?")) {
        teams = teams.filter(item => item.id != id);
        localStorage.setItem('teams', JSON.stringify(teams));
        renderTeams();
        populateTeamSelectors();
      }
    }

    function renderTeams() {
      let html = "";
      teams.forEach(t => {
        html += `
          <div style="border-bottom: 1px solid #334155; padding: 10px 0; text-align: left;">
            <strong>${t.name}</strong> (${t.p1 || '-'} & ${t.p2 || '-'})<br>
            <small>Vitórias no Ranking: ${t.wins}</small><br>
            <button onclick="editTeam(${t.id})" style="background: #3b82f6; color: white;">Editar</button>
            <button onclick="deleteTeam(${t.id})" style="background: var(--danger); color: white;">Excluir</button>
          </div>`;
      });
      document.getElementById('teamsList').innerHTML = html || "<p>Nenhuma dupla cadastrada.</p>";
    }

    function renderRanking() {
      let sorted = [...teams].sort((a, b) => b.wins - a.wins);
      let html = "<tr><th>Pos</th><th>Dupla</th><th>Vitórias</th></tr>";
      sorted.forEach((t, i) => {
        html += `<tr><td>${i + 1}º</td><td><strong>${t.name}</strong></td><td>${t.wins}</td></tr>`;
      });
      document.getElementById('rankingTable').innerHTML = html;
    }

    function resetRanking() {
      if (confirm("⚠️ Tem certeza que deseja zerar todas as vitórias do ranking?\n\nAs duplas cadastradas serão mantidas, mas o placar de vitórias voltará a ZERO.")) {
        teams.forEach(t => t.wins = 0);
        localStorage.setItem('teams', JSON.stringify(teams));
        renderRanking();
        alert("🏆 Ranking zerado com sucesso!");
      }
    }

    // SISTEMA DE PREVISÃO DO TEMPO COM BUSCA ROBUTA E ILUSTRAÇÃO SVG DE QUALIDADE
    const key = "4b84b68fcde6831bfc64ed1767626433"; // Cole sua chave OpenWeather entre as aspas

    async function getWeather() {
      let city = document.getElementById('cityName').value.trim();
      let state = document.getElementById('stateSelect').value;
      
      if (!city) return alert("Por favor, digite o nome de uma cidade!");

      const display = document.getElementById('weather-display');
      display.innerHTML = "⏳ Buscando previsão...";

      // Trata nome da cidade removendo o estado por extenso caso o usuário digite
      city = city.replace(/paraná|parana|são paulo|sao paulo|santa catarina|rio grande do sul|minas gerais/gi, '').trim();

      try {
        let searchQuery = state ? `${city},${state},BR` : `${city},BR`;
        let url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(searchQuery)}&appid=${key}&units=metric&lang=pt_br`;
        
        let res = await fetch(url);
        let data = await res.json();

        if (data.cod === 200) {
          renderWeatherData(data, state);
        } else {
          // Tenta segunda busca sem o estado na query caso a primeira falhe
          let retryUrl = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)},BR&appid=${key}&units=metric&lang=pt_br`;
          let retryRes = await fetch(retryUrl);
          let retryData = await retryRes.json();

          if (retryData.cod === 200) {
            renderWeatherData(retryData, state);
          } else {
            display.innerHTML = "❌ Cidade não encontrada. Verifique a ortografia do nome.";
          }
        }
      } catch (e) {
        display.innerHTML = "❌ Erro ao buscar previsão. Verifique a conexão com a internet.";
      }
    }

    function getWeatherByGPS() {
      const display = document.getElementById('weather-display');
      display.innerHTML = "📍 Buscando localização do GPS...";
      if (!navigator.geolocation) return alert("Geolocalização não suportada.");

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          let url = `https://api.openweathermap.org/data/2.5/weather?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&appid=${key}&units=metric&lang=pt_br`;
          try {
            let res = await fetch(url);
            let data = await res.json();
            if (data.cod === 200) renderWeatherData(data);
          } catch(e) {
            display.innerHTML = "Erro ao carregar clima via GPS.";
          }
        },
        () => alert("Permissão de localização negada.")
      );
    }

    function renderWeatherData(data, stateHint = "") {
      const display = document.getElementById('weather-display');
      const mainWeather = data.weather[0].main.toLowerCase();
      const windSpeed = data.wind.speed;
      const temp = data.main.temp;
      
      let alertMsg = "";
      let alertStyle = "";
      
      // Definição das cores do céu conforme o clima
      let skyGradient = "linear-gradient(to bottom, #38bdf8, #bae6fd)"; // Sol
      let weatherElementsSvg = `
        <circle cx="320" cy="45" r="28" fill="#facc15" />
        <line x1="320" y1="5" x2="320" y2="12" stroke="#facc15" stroke-width="3"/>
        <line x1="320" y1="78" x2="320" y2="85" stroke="#facc15" stroke-width="3"/>
        <line x1="280" y1="45" x2="287" y2="45" stroke="#facc15" stroke-width="3"/>
        <line x1="353" y1="45" x2="360" y2="45" stroke="#facc15" stroke-width="3"/>
      `;

      if (mainWeather.includes("rain") || mainWeather.includes("drizzle") || mainWeather.includes("thunderstorm")) {
        alertMsg = "🌧️ Ops, marcando chuva! Voleizinho em dúvida ☔";
        alertStyle = "background: #7f1d1d; color: #fca5a5;";
        skyGradient = "linear-gradient(to bottom, #1e293b, #475569)";
        weatherElementsSvg = `
          <path d="M 80 40 Q 95 20 120 25 Q 145 15 170 30 Q 190 30 195 45 Z" fill="#94a3b8" />
          <path d="M 230 45 Q 245 25 270 30 Q 295 20 320 35 Q 340 35 345 50 Z" fill="#64748b" />
          <!-- Gotas de Chuva -->
          <line x1="100" y1="60" x2="95" y2="75" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4"/>
          <line x1="140" y1="65" x2="135" y2="80" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4"/>
          <line x1="260" y1="65" x2="255" y2="80" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4"/>
          <line x1="300" y1="70" x2="295" y2="85" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4"/>
        `;
      } else if (mainWeather.includes("clouds")) {
        alertMsg = "☁️ Tempo nublado! Bom para jogar sem sol no olho.";
        alertStyle = "background: #334155; color: #cbd5e1;";
        skyGradient = "linear-gradient(to bottom, #64748b, #cbd5e1)";
        weatherElementsSvg = `
          <path d="M 100 50 Q 115 30 140 35 Q 165 25 190 40 Q 210 40 215 55 Z" fill="#ffffff" opacity="0.8"/>
          <path d="M 240 40 Q 255 20 280 25 Q 305 15 330 30 Q 350 30 355 45 Z" fill="#f1f5f9" opacity="0.9"/>
        `;
      } else if (temp >= 30) {
        alertMsg = "🔥 Calor acima da média, o voleizinho vai ser quente ☀️";
        alertStyle = "background: #9a3412; color: #fed7aa;";
      } else if (windSpeed > 5) {
        alertMsg = "💨 Vento acima da média, a bola pode sofrer desvios!";
        alertStyle = "background: #78350f; color: #fde68a;";
      } else {
        alertMsg = "☀️ Condição ideal para um voleizinho!";
        alertStyle = "background: #14532d; color: #86efac;";
      }

      let locationText = data.name + (stateHint ? `, ${stateHint}` : '') + ` - ${data.sys.country}`;

      display.innerHTML = `
        <div style="font-size: 1.4rem; font-weight: bold;">${locationText}</div>
        <div style="font-size: 2.8rem; font-weight: bold; color: var(--accent); margin: 5px 0;">${Math.round(temp)}°C</div>
        <div style="text-transform: capitalize; font-size: 1.1rem;">${data.weather[0].description}</div>

        <!-- QUADRA DE VÔLEI EM VETOR SVG -->
        <div class="court-illustration-container">
          <svg class="court-svg" viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg">
            <!-- Céu Temático -->
            <rect width="400" height="120" fill="url(#skyGrad)"/>
            <defs>
              <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="${skyGradient.split(',')[1].trim()}" />
                <stop offset="100%" stop-color="${skyGradient.split(',')[2].replace(')','').trim()}" />
              </linearGradient>
            </defs>

            <!-- Elementos Climáticos (Sol / Nuvens / Chuva) -->
            ${weatherElementsSvg}

            <!-- Areia da Quadra de Vôlei -->
            <polygon points="0,120 400,120 400,180 0,180" fill="#eab308" />
            <polygon points="20,135 380,135 390,175 10,175" fill="#f59e0b" stroke="#fef08a" stroke-width="2" />

            <!-- Postes da Rede de Vôlei -->
            <line x1="200" y1="75" x2="200" y2="155" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

            <!-- Rede de Vôlei de Praia detalhada -->
            <rect x="50" y="80" width="300" height="30" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="2"/>
            <!-- Linhas da malha da rede -->
            <path d="M 50 90 L 350 90 M 50 100 L 350 100" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
            <path d="M 80 80 L 80 110 M 110 80 L 110 110 M 140 80 L 140 110 M 170 80 L 170 110 M 230 80 L 230 110 M 260 80 L 260 110 M 290 80 L 290 110 M 320 80 L 320 110" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
            <!-- Borda Superior Amarela da Rede -->
            <line x1="48" y1="80" x2="352" y2="80" stroke="#facc15" stroke-width="4"/>

            <!-- Bola de Vôlei de Praia em Jogo -->
            <circle cx="140" cy="65" r="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
            <path d="M 132 62 Q 140 68 148 62" stroke="#facc15" stroke-width="2" fill="none"/>
            <path d="M 135 72 Q 140 65 145 72" stroke="#facc15" stroke-width="2" fill="none"/>
          </svg>
        </div>

        <div class="volley-alert" style="${alertStyle}">
          ${alertMsg}
        </div>

        <div class="grid-weather">
          <div class="weather-item"><strong>Sensação</strong><br>${Math.round(data.main.feels_like)}°C</div>
          <div class="weather-item"><strong>Umidade</strong><br>${data.main.humidity}%</div>
          <div class="weather-item"><strong>Vento</strong><br>${windSpeed} m/s</div>
          <div class="weather-item"><strong>Mín / Máx</strong><br>${Math.round(data.main.temp_min)}° / ${Math.round(data.main.temp_max)}°</div>
        </div>
      `;
    }

    // Inicialização
    renderTeams();
    populateTeamSelectors();
  </script>
</body>
</html>
