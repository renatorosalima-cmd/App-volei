<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Vôlei Mobile</title>
  <style>
    :root { --bg: #0f172a; --card-bg: #1e293b; --accent: #facc15; --text: #f8fafc; --danger: #ef4444; }
    body { background: var(--bg); color: var(--text); padding: 1rem; padding-bottom: 80px; font-family: system-ui, sans-serif; margin: 0; }
    .card { background: var(--card-bg); padding: 1rem; border-radius: 12px; margin-bottom: 1rem; }
    h2, h3 { margin-top: 0; }
    input { width: 90%; padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
    button { padding: 10px 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; margin: 4px 2px; }
    .btn-main { background: var(--accent); color: #000; width: 100%; font-size: 1rem; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-edit { background: #3b82f6; color: #fff; }
    .btn-win { background: #22c55e; color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #334155; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: #020617; display: flex; justify-content: space-around; padding: 12px 0; border-top: 2px solid var(--accent); }
    nav button { background: none; color: white; font-size: 1.4rem; }
  </style>
</head>
<body>

  <!-- GERENCIAR DUPLAS -->
  <div id="tab-times" class="tab-content active">
    <div class="card">
      <h3 id="form-title">➕ Nova Dupla</h3>
      <input type="hidden" id="edit-id">
      <input type="text" id="timeName" placeholder="Nome do Time/Dupla">
      <input type="text" id="p1Name" placeholder="Jogador 1">
      <input type="text" id="p2Name" placeholder="Jogador 2">
      <button class="btn-main" onclick="saveTeam()">Salvar Dupla</button>
      <button id="btn-cancel" style="display:none;" onclick="resetForm()">Cancelar Edição</button>
    </div>

    <div class="card">
      <h3>👥 Duplas Cadastradas</h3>
      <div id="teamsList"></div>
    </div>
  </div>

  <!-- RANKING -->
  <div id="tab-ranking" class="tab-content">
    <div class="card">
      <h3>🏆 Tabela de Classificação</h3>
      <table id="rankingTable"></table>
    </div>
  </div>

  <!-- NAVEGAÇÃO -->
  <nav>
    <button onclick="show('tab-times')">👥</button>
    <button onclick="show('tab-ranking')">🏆</button>
  </nav>

  <script>
    let teams = JSON.parse(localStorage.getItem('volei_teams')) || [];

    function show(tabId) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (tabId === 'tab-ranking') renderRanking();
    }

    function saveTeam() {
      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('timeName').value.trim();
      const p1 = document.getElementById('p1Name').value.trim();
      const p2 = document.getElementById('p2Name').value.trim();

      if (!name || !p1 || !p2) {
        alert("Preencha todos os campos!");
        return;
      }

      if (id) {
        // Editar Dupla existente
        const team = teams.find(t => t.id == id);
        if (team) {
          team.name = name;
          team.p1 = p1;
          team.p2 = p2;
        }
      } else {
        // Criar Nova Dupla
        teams.push({ id: Date.now(), name, p1, p2, wins: 0 });
      }

      saveAndRender();
      resetForm();
    }

    function editTeam(id) {
      const team = teams.find(t => t.id == id);
      if (!team) return;

      document.getElementById('edit-id').value = team.id;
      document.getElementById('timeName').value = team.name;
      document.getElementById('p1Name').value = team.p1;
      document.getElementById('p2Name').value = team.p2;

      document.getElementById('form-title').innerText = "✏️ Editar Dupla";
      document.getElementById('btn-cancel').style.display = "inline-block";
    }

    function deleteTeam(id) {
      if (confirm("Tem certeza que deseja apagar esta dupla?")) {
        teams = teams.filter(t => t.id != id);
        saveAndRender();
      }
    }

    function addWin(id) {
      const team = teams.find(t => t.id == id);
      if (team) {
        team.wins++;
        saveAndRender();
      }
    }

    function resetForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('timeName').value = '';
      document.getElementById('p1Name').value = '';
      document.getElementById('p2Name').value = '';
      document.getElementById('form-title').innerText = "➕ Nova Dupla";
      document.getElementById('btn-cancel').style.display = "none";
    }

    function saveAndRender() {
      localStorage.setItem('volei_teams', JSON.stringify(teams));
      renderTeams();
    }

    function renderTeams() {
      const container = document.getElementById('teamsList');
      if (teams.length === 0) {
        container.innerHTML = "<p>Nenhuma dupla cadastrada.</p>";
        return;
      }

      let html = "";
      teams.forEach(t => {
        html += `
          <div style="border-bottom: 1px solid #334155; padding: 8px 0;">
            <strong>${t.name}</strong> (${t.p1} & ${t.p2})<br>
            <small>Vitórias: ${t.wins}</small><br>
            <button class="btn-win" onclick="addWin(${t.id})">+1 Vitória</button>
            <button class="btn-edit" onclick="editTeam(${t.id})">Editar</button>
            <button class="btn-danger" onclick="deleteTeam(${t.id})">Excluir</button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function renderRanking() {
      const sorted = [...teams].sort((a, b) => b.wins - a.wins);
      let html = "<tr><th>Pos</th><th>Dupla</th><th>Jogadores</th><th>Vitórias</th></tr>";
      sorted.forEach((t, i) => {
        html += `
          <tr>
            <td>${i + 1}º</td>
            <td><strong>${t.name}</strong></td>
            <td>${t.p1} / ${t.p2}</td>
            <td>${t.wins}</td>
          </tr>
        `;
      });
      document.getElementById('rankingTable').innerHTML = html;
    }

    renderTeams();
  </script>
</body>
</html>
